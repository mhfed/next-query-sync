name: Temporary dependency remediation

on:
  push:
    branches:
      - chore/security-audit-1.1

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[deps-remediated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: chore/security-audit-1.1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Upgrade test toolchain and apply non-breaking audit fixes
        working-directory: packages
        run: |
          npm install --save-dev vitest@^4.1.10
          npm audit fix || true

      - name: Verify remediated package
        working-directory: packages
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run verify:types
          npm run verify:examples
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      - name: Commit only dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/package.json packages/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes produced."
            exit 0
          fi
          git commit -m "chore: remediate test toolchain audit findings [deps-remediated]"
          git push origin HEAD:chore/security-audit-1.1
