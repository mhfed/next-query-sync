name: Temporary 1.1.0 manifest bump

on:
  push:
    branches:
      - release/1.1.0-prep

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[version-bumped]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/1.1.0-prep
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Bump manifests without tag
        working-directory: packages
        run: npm version 1.1.0 --no-git-tag-version

      - name: Verify manifest versions
        working-directory: packages
        run: |
          test "$(node -p \"require('./package.json').version\")" = "1.1.0"
          test "$(node -p \"require('./package-lock.json').version\")" = "1.1.0"
          test "$(node -p \"require('./package-lock.json').packages[''].version\")" = "1.1.0"

      - name: Commit only version manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/package.json packages/package-lock.json
          git commit -m "release: bump manifests to 1.1.0 [version-bumped]"
          git push origin HEAD:release/1.1.0-prep
